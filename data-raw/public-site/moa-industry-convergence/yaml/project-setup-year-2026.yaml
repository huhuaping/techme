# 2026年农业产业融合发展项目拟立项名单
# 本文件对照 html/project-setup-year-2026.html 整理，作为 2026 年起的权威中间层。
#
# R 读取示例：
#   yml <- yaml::read_yaml(path)
#   tbl_park <- dplyr::bind_rows(yml$park) |>
#     dplyr::mutate(year = yml$year, .before = 1)
#
# 字段约定：
#   year                 立项年份，与文件名 project-setup-year-{year} 对齐
#   name_raw             公示原文（已去掉序号）
#   name                 与往年 xlsx 的 name 对齐；park 补全「现代农业产业园」
#   province             BasicProvince 简称；兵团/农垦按往年规则归并
#   province_raw         公示原文中的省区或垦区主体
#   place                park 去掉省区后的县市区；解析不到则为 null
#   towns / n_town       town 的乡镇序列及其个数；xlsx 再按 province 合并
#
# 导出 xlsx 列（与往年一致，可 bind_rows）：
#   park/cluster: year, index, name, province
#   town:         year, index, province, town, n

